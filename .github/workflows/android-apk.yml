# Compila la app Android de Cocina (android-app/) en los servidores gratuitos de GitHub.
# Uso: pestaña Actions → "APK Android de Cocina" → Run workflow → escribe la dirección HTTPS.
# El APK queda en la ejecución, sección Artifacts.
name: APK Android de Cocina

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "Dirección HTTPS del negocio (ej. https://pedidos.tudominio.com)"
        required: true

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: android-app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Instalar Capacitor
        run: npm ci

      - name: Configurar la dirección del negocio
        env:
          SITE_URL: ${{ inputs.site_url }}
        run: node scripts/set-url.mjs "$SITE_URL"

      - name: Sincronizar proyecto Android
        run: npx cap sync android

      - name: Preparar llave de firma
        id: firma
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/cocina.jks"
            echo "file=$RUNNER_TEMP/cocina.jks" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Sin el secreto ANDROID_KEYSTORE_BASE64 el APK se firma con una llave temporal: sirve para probar, pero cada versión nueva obligará a desinstalar la anterior."
          fi

      - name: Compilar APK
        working-directory: android-app/android
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_FILE: ${{ steps.firma.outputs.file }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$ANDROID_KEYSTORE_FILE" ]; then
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/los-santos-cocina.apk"
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/los-santos-cocina.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: los-santos-cocina-${{ github.run_number }}
          path: ${{ runner.temp }}/los-santos-cocina.apk
          if-no-files-found: error
