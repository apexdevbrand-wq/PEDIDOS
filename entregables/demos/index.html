<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Los Santos · Demos visuales</title><style>body{margin:0;background:#faf8f4;color:#29231e;font:15px Arial,sans-serif}header{padding:22px 5%;background:#fff;border-bottom:1px solid #e3dbcd}h1{color:#dc2725;margin:0;font-size:28px;font-style:italic}p{color:#796e62;font-size:13px;line-height:1.6}nav{display:flex;gap:8px;flex-wrap:wrap}button{padding:10px 16px;border:1px solid #ddd4c7;border-radius:7px;background:#fff;cursor:pointer}.active{color:#fff;background:#dc2725;border-color:#dc2725}main{padding:24px 4%;text-align:center}img{width:100%;max-width:1440px;height:auto;box-shadow:0 5px 25px #0001;border:1px solid #ddd4c7;border-radius:8px}.mobile{max-width:390px}a{color:#c42624}</style><header><h1>Los Santos.</h1><p>Galería de la aplicación ejecutándose. Estas capturas son demos visuales; para interactuar con los pedidos, ejecuta el proyecto incluido.</p><nav id="tabs"><button class="active" data-file="01-cliente.png">Cliente</button><button data-file="02-checkout.png">Checkout</button><button data-file="03-cocina.png">Cocina</button><button data-file="04-administracion.png">Administración</button><button data-file="05-movil.png">Móvil</button></nav></header><main><img id="demo" src="01-cliente.png" alt="Demo de la vista de cliente"></main><script>document.querySelectorAll('button').forEach(b=>b.onclick=()=>{document.querySelector('.active').classList.remove('active');b.classList.add('active');const img=document.getElementById('demo');img.src=b.dataset.file;img.alt='Demo: '+b.textContent;img.className=b.dataset.file.includes('movil')?'mobile':''})</script></html>
